name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Solution
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild SteamTradeCardDropper.sln /p:Configuration=Release /v:m

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SteamTradeCardDropper-Release
        path: |
          src/SteamTradeCardDropper/bin/Release/SteamTradeCardDropper.exe
          src/SteamTradeCardDropper/bin/Release/SteamTradeCardDropper.exe.config
          src/SteamTradeCardDropper/bin/Release/steam_api64.dll
          src/SteamTradeCardDropper/bin/Release/Steamworks.NET.dll
          src/SteamTradeCardDropper/bin/Release/HtmlAgilityPack.dll
        if-no-files-found: error
